services:
  - type: web
    name: archora-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 1hTYk7StoL5GsRpitJyAwdaVf_ivleUWl
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: archora-data
      mountPath: /data
      sizeGB: 1

